# Step 04 (auth, tenants, roles and permissions): checks, end-to-end tests
# and deploys, by branch. Code moves main -> dev -> prod through pull requests.
#
#   PR into main          type-check + unit/integration tests (no secrets)
#   PR main -> dev        deploy the PR to STAGING, full end-to-end suite, clean up
#   merge into dev        deploy STAGING, full end-to-end suite, clean up
#   PR dev -> prod        promotion check only, no deploy: this exact dev commit
#                         must already have deployed to staging and passed the
#                         full suite (in the run for its merge into dev)
#   merge into prod       deploy PRODUCTION, smoke check, clean up; if the
#                         smoke check fails, production rolls back to the
#                         version that was live before, automatically
#
# The gates are before the merges. Branch protection on dev requires the
# Staging check (the PR's code deployed to staging and tested end to end);
# on prod it requires the Promotion check (the commit being promoted is one
# that passed staging). A PR into prod adds no code, so it isn't redeployed
# or retested: only PRs into dev and merges into dev ever deploy staging.
# The run after a merge into dev never reverts anything (staging has no
# customers); if it fails, fix forward on dev before promoting.
# A production rollback restores the Worker, not git: open a revert PR into
# prod afterwards so the branch matches what runs. Rollbacks don't undo D1
# migrations, so migrations must stay backward compatible (add first, remove
# in a later release).
#
# Staging is its own Worker (learn-mcp-step-04-staging) with its own D1, KV
# and auth secret, and it never sends email. Cleanup deletes only what the
# run created (users, companies, tenants, OAuth clients and notes tagged
# e2e-<run>-), and runs whether the tests passed, failed or were cancelled.
# See step-04-auth/e2e/.
#
# Secrets live in GitHub environments (Settings > Environments):
#   staging:    CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STAGING_BETTER_AUTH_SECRET
#   production: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Limit "production" to the prod branch and give it required reviewers, so a
# person approves every production deploy.

name: step-04 pipeline

on:
  # No path filters: dev and prod require checks before a merge (a check that
  # never runs would block the PR), and every merge into dev must leave a
  # staging run behind for the promotion check to find.
  pull_request:
    branches: [main, dev, prod]
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: step-04-auth

jobs:
  checks:
    name: Type-check and tests
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: step-04-auth/package-lock.json
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test

  staging:
    name: Staging (deploy and full end-to-end suite)
    # Pull requests into dev (never from forks: they must not reach these
    # secrets), merges into dev, or a manual run on dev.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'dev'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: staging
    # One run at a time: staging is a single deployment.
    concurrency: { group: step-04-staging, cancel-in-progress: false }
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      E2E_TARGET: staging
      E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: step-04-auth/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -p .
      - name: Unit and integration tests (Workers runtime)
        run: npm test
      - name: Remove leftovers of earlier runs whose cleanup never ran
        run: node e2e/cleanup.ts --target staging --stale-hours 6
      - name: Migrate the staging database
        run: npx wrangler d1 migrations apply AUTH_DB --remote --env staging
      - name: Deploy to the staging Worker
        run: npx wrangler deploy --env staging
      - name: End-to-end tests against staging
        env:
          E2E_INVITATION_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
        run: npm run e2e -- e2e/full.e2e.ts
      - name: Delete everything this run created
        if: always()
        run: node e2e/cleanup.ts --target staging --run "$E2E_RUN_ID"

  promotion:
    name: Promotion check (this dev commit passed staging)
    # Pull requests into prod. Deploys nothing and needs no secrets: it asks
    # GitHub whether the run for this commit's merge into dev (staging deploy
    # and full end-to-end suite) succeeded.
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 45
    steps:
      - name: Check that this exact commit passed staging
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          query="repos/$GITHUB_REPOSITORY/actions/workflows/step-04-e2e.yml/runs?branch=dev&event=push&head_sha=$SHA&per_page=20"
          # If that run is still going (you opened this PR right after merging
          # into dev), wait for it rather than failing.
          for attempt in $(seq 1 80); do
            runs=$(gh api "$query" --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            passed=$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')
            running=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            if [ "$passed" -gt 0 ]; then
              url=$(echo "$runs" | jq -r '[.[] | select(.conclusion == "success")][0].url')
              echo "Commit $SHA was deployed to staging and passed the full suite: $url"
              echo "Promoting \`${SHA:0:7}\`, which passed staging in $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$running" -eq 0 ]; then break; fi
            echo "The staging run for $SHA is still in progress; waiting…"
            sleep 30
          done
          echo "::error::Commit ${SHA:0:7} has no successful staging run from a merge into dev. Merge it into dev first (or re-run the failed or cancelled 'push' run for it in Actions), then re-run this check. Runs found: $runs"
          exit 1

  production:
    name: Production (deploy and smoke check)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: step-04-production, cancel-in-progress: false }
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      E2E_TARGET: production
      E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: step-04-auth/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc -p .
      - name: Unit and integration tests (Workers runtime)
        run: npm test
      - name: Remember the live version (to roll back to)
        id: live
        run: |
          version=$(npx wrangler deployments list --json | node -e '
            const list = JSON.parse(require("fs").readFileSync(0, "utf8"));
            list.sort((a, b) => a.created_on.localeCompare(b.created_on));
            const live = list.at(-1)?.versions?.find((v) => v.percentage === 100);
            process.stdout.write(live?.version_id ?? "");
          ')
          echo "Live version before this deploy: ${version:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Migrate the production database
        run: npx wrangler d1 migrations apply AUTH_DB --remote
      - name: Deploy to the production Worker
        id: deploy
        run: npx wrangler deploy
      - name: Smoke check against production
        run: npm run e2e -- e2e/smoke.e2e.ts
      - name: Roll back production (the smoke check failed)
        if: failure() && steps.deploy.outcome == 'success' && steps.live.outputs.version != ''
        env:
          PREVIOUS_VERSION: ${{ steps.live.outputs.version }}
        run: |
          npx wrangler rollback "$PREVIOUS_VERSION" --message "Smoke check failed in GitHub run $GITHUB_RUN_ID" --yes
          {
            echo "## Production was rolled back"
            echo "The smoke check failed, so production is back on version \`$PREVIOUS_VERSION\`."
            echo "Open a revert PR into prod so the branch matches what runs. D1 migrations were not undone."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete everything this run created
        if: always()
        run: node e2e/cleanup.ts --target production --run "$E2E_RUN_ID"
